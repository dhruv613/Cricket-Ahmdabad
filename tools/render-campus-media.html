<!doctype html><meta charset="utf-8"><title>Campus media renderer</title>

<style>body{margin:0}canvas{display:block}</style>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from '../vendor/meshoptimizer/meshopt_decoder.module.js';
import {createPlayers} from '../campus/players.js';

renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;

const views={
  'outdoor-nets':{position:[-32,92,61],target:[-93,1,-6],width:1400,height:1200},
  'nets-training':{position:[-85,2.6,-19],target:[-103,1.3,-19],width:1400,height:1000,hidePlayers:true},
  'ground-day':{position:[74,126,134],target:[0,1,0],width:1400,height:1000},
  'ground-night':{position:[74,126,134],target:[0,1,0],width:1400,height:1000,night:true},
  'match-ground':{position:[-78,74,106],target:[0,1,-3],width:1400,height:1000},
  'fitness':{position:[59,27,112],target:[30,1,84],width:1400,height:1000}

</script>
