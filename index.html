    html,

      padding: 0;

      from {

      }

      to {
        transform: scaleX(1);
      }
    }

    @keyframes rmsa-fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes rmsa-scroll {
      0% {
        transform: scaleY(0);
        transform-origin: top;
      }

      50% {
        transform: scaleY(1);
        transform-origin: top;
      }

      51% {
        transform: scaleY(1);
        transform-origin: bottom;
      }

      100% {

  <script>
    (function () {
      'use strict';

      /* ═══════════════════════════════════════════════════════════
         State
         ═══════════════════════════════════════════════════════════ */
      var state = {
        sport: null,
        reveal: false,
        curtain: true,
        explore: false
      };

      /* ═══════════════════════════════════════════════════════════
         Config (from academy-config.js)
         ═══════════════════════════════════════════════════════════ */
      function cfg() {
        return window.ACADEMY || { brand: {}, hero: { primaryCta: {} }, nav: [], navCta: {}, facilities: [] };
      }

      /* ═══════════════════════════════════════════════════════════
         DOM References
         ═══════════════════════════════════════════════════════════ */
      var $veilTop = document.getElementById('veil-top');
      var $veilLeft = document.getElementById('veil-left');
      var $veilBottom = document.getElementById('veil-bottom');
      var $nav = document.getElementById('main-nav');
      var $navMark = document.getElementById('nav-mark');
      var $navSub = document.getElementById('nav-sub');
      var $navLinks = document.getElementById('nav-links');
      var $backBtn = document.getElementById('back-btn');
      var $hero = document.getElementById('hero-content');
      var $kickerText = document.getElementById('kicker-text');
      var $headline = document.getElementById('hero-headline');
      var $heroSub = document.getElementById('hero-sub');
      var $heroCtas = document.getElementById('hero-ctas');
      var $panel = document.getElementById('facility-panel');
      var $panelNum = document.getElementById('panel-num');
      var $panelLabel = document.getElementById('panel-label');
      var $panelTitle = document.getElementById('panel-title');
      var $panelPoints = document.getElementById('panel-points');
      var $panelLink = document.getElementById('panel-link');
      var $selectorBar = document.getElementById('selector-bar');
      var $selectorFac = document.getElementById('selector-facilities');
      var $curtain = document.getElementById('curtain');
      var $curtainBrand = document.getElementById('curtain-brand');

      /* ═══════════════════════════════════════════════════════════
         Scene helper
         ═══════════════════════════════════════════════════════════ */
      function scene() { return document.getElementById('campus'); }

      /* ═══════════════════════════════════════════════════════════
         Actions
         ═══════════════════════════════════════════════════════════ */
      function pick(key) {
        var next = state.sport === key ? null : key;
        state.sport = next;
        // Selecting an area from the immersive campus keeps the visitor in
        // that full-screen 3D view; only the back action exits it.
        var s = scene();
        if (s && s.setSport) s.setSport(next);
        render();
      }

      // Sections lower down link into the campus model; unlike `pick` this always selects, never toggles.
      function focusFacility(key) {
        var known = (cfg().facilities || []).some(function (f) { return f.key === key; });
        if (!known) return;
        state.sport = key;
        state.explore = false;
        var s = scene();
        if (s && s.setSport) s.setSport(key);
        render();
      }

      function toOverview() {
        state.sport = null;
        state.explore = false;
        var s = scene();
        if (s && s.setSport) s.setSport(null);
      }

      function doExplore() {
        toOverview();
        state.explore = true;
        render();
      }

      function doOverview() {
        toOverview();
        render();
      }

      // Back steps out one level at a time: area -> campus overview -> page. Leaving the immersive
      // view straight from a selected area used to drop the visitor onto the home page mid-tour.
      function goBack() {
        if (state.sport) {
          state.sport = null;
          var s = scene();
          if (s && s.setSport) s.setSport(null);
        } else {
          state.explore = false;
        }
        render();
      }

      /* ═══════════════════════════════════════════════════════════
         Render — apply state to DOM
         ═══════════════════════════════════════════════════════════ */
      var _navBuilt = false;
      var _selectorBuilt = false;

      function render() {
        var C = cfg();
        var brand = C.brand || {};
        var hero = C.hero || { primaryCta: {} };
        var navCta = C.navCta || {};
        var navItems = C.nav || [];
        var facilities = C.facilities || [];
        var sel = state.sport;
        var active = facilities.find(function (f) { return f.key === sel; }) || facilities[0] || { points: [] };
        var ex = state.explore;
        var heroShown = state.reveal && !ex && !sel;
        var uiShown = state.reveal && !ex;
        document.getElementById('top').classList.toggle('is-exploring', ex);
        document.body.classList.toggle('campus-fullscreen', ex);
        document.getElementById('top').classList.toggle('has-selection', Boolean(sel));
        document.getElementById('explore-campus').hidden = !state.reveal || ex || Boolean(sel);

        /* ── Static text (once) ── */
        document.getElementById('nav-monogram').textContent = brand.monogram || '';
        $navMark.textContent = brand.mark || '';
        $navSub.textContent = brand.markSub || '';
        $kickerText.textContent = brand.kicker || '';
        $curtainBrand.textContent = brand.full || '';

        $headline.replaceChildren();
        ['headlineTop', 'headlineBottom'].forEach(function (key, index) {
          var span = document.createElement('span');
          span.className = index === 0 ? 'hero-title-top' : 'hero-title-bottom';
          span.textContent = hero[key] || '';
          $headline.appendChild(span);
        });
        $heroSub.textContent = hero.sub || '';
        document.getElementById('hero-supporting').textContent = hero.supportingLine || '';

        /* ── Nav links (build once) ── */
        if (!_navBuilt && navItems.length) {
          _navBuilt = true;
          $navLinks.innerHTML = '';
          navItems.forEach(function (n, i) {
            var a = document.createElement('a');
            a.href = n.href;
            a.textContent = n.label;
            a.style.color = i === 0 ? '#eef3ec' : 'rgba(238,243,236,.62)';
            $navLinks.appendChild(a);
          });
          var ctaA = document.createElement('a');
          ctaA.href = navCta.href || '#trial';
          ctaA.textContent = navCta.label || 'BOOK TRIAL';
          ctaA.className = 'nav-cta';
          $navLinks.appendChild(ctaA);
        }

        /* ── Hero CTAs (build once) ── */
        if ($heroCtas.children.length === 0 && hero.primaryCta) {
          var pa = document.createElement('a');
          pa.href = hero.primaryCta.href || '#trial';
          pa.textContent = hero.primaryCta.label || '';
          pa.className = 'cta-primary';
          $heroCtas.appendChild(pa);

          var sb = document.createElement('a');
          sb.href = '#facilities';
          sb.textContent = hero.secondaryCta || '';
          sb.className = 'cta-secondary';
          $heroCtas.appendChild(sb);
        }

        /* ── Selector (build once) ── */
        if (!_selectorBuilt && facilities.length) {
          _selectorBuilt = true;
          $selectorFac.innerHTML = '';
          facilities.forEach(function (f) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'facility-btn';
            btn.dataset.key = f.key;
            btn.innerHTML =
              '<span class="facility-btn-num">' + f.num + '</span>' +
              '<span class="facility-btn-label">' + f.label + '</span>';
            btn.addEventListener('click', function () { pick(f.key); });
            $selectorFac.appendChild(btn);
          });
        }

        /* ── Update selector highlight ── */
        var btns = $selectorFac.querySelectorAll('.facility-btn');
        btns.forEach(function (btn) {
          var on = sel === btn.dataset.key;
          btn.setAttribute('aria-pressed', String(on));
          btn.classList.toggle('is-active', on);
          btn.style.borderBottomColor = on ? '#2fc6ff' : 'rgba(200,216,232,0)';
          btn.querySelector('.facility-btn-num').style.color = on ? '#2fc6ff' : 'rgba(198,214,230,.38)';
          btn.querySelector('.facility-btn-label').style.color = on ? '#2fc6ff' : 'rgba(205,219,233,.58)';
        });

        /* ── Facility panel ── */
        $panel.style.opacity = sel ? 1 : 0;
        $panel.style.transform = 'translateY(' + (sel ? '-50%' : 'calc(-50% + 14px)') + ')';
        $panel.style.pointerEvents = sel ? 'auto' : 'none';
        $panel.inert = !sel;
        $panelNum.textContent = active.num || '';
        $panelLabel.textContent = active.label || '';
        $panelTitle.textContent = active.title || '';
        $panelLink.href = active.href || '#programs';
        $panelPoints.innerHTML = '';
        (active.points || []).forEach(function (pt) {
          var d = document.createElement('div');
          d.className = 'panel-point';
          d.innerHTML = '<span class="panel-point-dash"></span>' + pt;
          $panelPoints.appendChild(d);
        });

        /* ── Hero content visibility ── */
        $hero.style.opacity = heroShown ? 1 : 0;
        $hero.style.transform = 'translateY(' + (heroShown ? '0px' : '22px') + ')';
        $hero.style.pointerEvents = heroShown ? 'auto' : 'none';
        $hero.inert = !heroShown;

        /* ── Veils ── */
        $veilLeft.style.opacity = uiShown ? 1 : 0;
        $veilTop.style.opacity = uiShown ? 1 : 0;
        $veilBottom.style.opacity = uiShown ? 1 : 0;

        /* ── Chrome (nav + selector bar) ── */
        $nav.style.opacity = uiShown ? 1 : 0;
        $nav.style.pointerEvents = uiShown ? 'auto' : 'none';
        $nav.inert = !uiShown;
        $selectorBar.style.opacity = state.reveal ? 1 : 0;
        $selectorBar.style.pointerEvents = state.reveal ? 'auto' : 'none';
        $selectorBar.inert = !state.reveal;

        /* ── Back button ── */
        var backVisible = (ex || sel) && state.reveal;
        $backBtn.style.opacity = backVisible ? 1 : 0;
        $backBtn.style.pointerEvents = (ex || sel) ? 'auto' : 'none';
        $backBtn.inert = !backVisible;
        $backBtn.style.top = ex ? '28px' : '104px';
        $backBtn.textContent = sel ? (hero.overviewCta || '← CAMPUS OVERVIEW') : (ex ? '← BACK TO HOME' : (hero.overviewCta || '← CAMPUS OVERVIEW'));
        $backBtn.setAttribute('aria-label', sel ? 'Return to the campus overview' : (ex ? 'Exit the 3D campus view' : 'Return to campus overview'));

        /* ── Curtain ── */
        $curtain.style.opacity = state.curtain ? 1 : 0;
        $curtain.style.pointerEvents = state.curtain ? 'auto' : 'none';
        $curtain.setAttribute('aria-hidden', String(!state.curtain));
      }

      /* ═══════════════════════════════════════════════════════════
         Event listeners
         ═══════════════════════════════════════════════════════════ */
      window.addEventListener('campus:select', function (e) {
        state.sport = (e.detail && e.detail.key) || null;
        // A hotspot may be chosen while already inside the full-screen tour.
        // Only an explicit overview/reset event changes that mode.
        if (!state.sport) state.explore = !!(e.detail && e.detail.explore);
        render();
      });

      window.addEventListener('campus:introdone', function () {
        state.reveal = true;
        render();
      });
      window.addEventListener('campus:ready', function () {
        document.getElementById('scene-status').hidden = true;
        document.querySelectorAll('#campus button').forEach(function (button) {
          var label = button.querySelector('[data-l]');
          if (label) button.setAttribute('aria-label', 'Explore ' + label.textContent);
        });
      });
      setTimeout(function () {
        var status = document.getElementById('scene-status');
        if (!status.hidden && status.dataset.state !== 'error') status.innerHTML = 'The 3D tour is taking longer to load. <a href="#facilities">Explore facilities below ↗</a>';
      }, 15000);

      window.addEventListener('campus:introstart', function () {
        state.reveal = false;
        state.sport = null;
        state.explore = false;
        state.curtain = true;
        render();
        // Curtain lifts after intro animation
        setTimeout(function () { state.curtain = false; render(); }, 1400);
      });

      window.addEventListener('academy:config', function () {
        render();
      });

      window.addEventListener('academy:focus-facility', function (e) {
        focusFacility(e.detail && e.detail.key);
      });

      // Without a working scene there is nothing to link to, so the page-level 3D affordances stand down.
      window.addEventListener('campus:error', function () {
        document.documentElement.classList.add('campus-unavailable');
      });

      $backBtn.addEventListener('click', goBack);
      document.getElementById('explore-campus').addEventListener('click', doExplore);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && (state.explore || state.sport)) {
          event.preventDefault();
          goBack();
        }
      });

      /* ═══════════════════════════════════════════════════════════
         Boot sequence
         ═══════════════════════════════════════════════════════════ */

      // Poll for config if it hasn't loaded yet
      if (!window.ACADEMY) {
        var tries = 0;
        var poll = setInterval(function () {
          if (window.ACADEMY || ++tries > 40) {
            clearInterval(poll);
            render();
          }
        }, 50);
      }

      // Initial render
      render();

      // Curtain lifts after 1.5s
      setTimeout(function () {
        state.curtain = false;
        render();
      }, 1500);

      // Hero reveals after camera fly-in (~6.2s)
      setTimeout(function () {
        state.reveal = true;
        render();
      }, 6200);

    })();
  </script>
  <script src="./Rajkot Multi-Sport Academy 3D/image-slot.js"></script>
  <script src="./academy-content.js"></script>

</body>

</html>
